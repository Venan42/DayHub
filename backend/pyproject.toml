[project]
name = "dayhub"
version = "0.1.0"
description = "Backend API for DayHub Personal Management System"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "litestar==2.24.0",
    "beanie==1.29.0",
    "motor==3.7.0",
    "pydantic-settings==2.15.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "email-validator==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]